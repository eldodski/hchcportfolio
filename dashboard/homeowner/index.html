<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Project | Hill Country Home Concepts</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ivory: #F5F0EB;
  --navy: #1B2A4A;
  --espresso: #3C2A21;
  --sand: #D4C5B2;
  --mocha: #A37762;
  --carrara: #E8E4E0;
  --gold: #C4A265;
  --dusty-blue: #7B9BAE;
  --sage: #8A9A7B;
  --heading: 'Cormorant Garamond', Georgia, serif;
  --body: 'Jost', 'Segoe UI', sans-serif;
}

body {
  font-family: var(--body);
  font-weight: 300;
  font-size: 16px;
  line-height: 1.6;
  color: var(--espresso);
  background: var(--ivory);
}

.portal { max-width: 1100px; margin: 0 auto; padding: 48px 32px 80px; }

.eyebrow {
  font-weight: 200;
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--mocha);
}

.portal-header { margin-bottom: 40px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; }
.portal-header h1 {
  font-family: var(--heading);
  font-weight: 600;
  font-size: 2.4rem;
  line-height: 1.15;
  color: var(--navy);
  margin-top: 6px;
}
.portal-header .project-name { font-family: var(--heading); font-size: 1.25rem; color: var(--espresso); margin-top: 4px; }

.project-switch select {
  font-family: var(--body);
  font-size: 0.85rem;
  padding: 8px 12px;
  border: 1px solid var(--sand);
  background: #fff;
  color: var(--espresso);
}

.section { margin-bottom: 56px; scroll-margin-top: 90px; }
.section-title {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  border-bottom: 1px solid var(--sand);
  padding-bottom: 12px;
  margin-bottom: 24px;
}
.section-title h2 { font-family: var(--heading); font-weight: 600; font-size: 1.6rem; color: var(--navy); }
.section-title .eyebrow { color: var(--dusty-blue); }

/* Documents */
.doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
.doc-group { background: #fff; border: 1px solid var(--carrara); padding: 22px 22px 14px; min-width: 0; }
.doc-group h3 {
  font-weight: 300;
  font-size: 0.75rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--navy);
  margin-bottom: 12px;
}
.doc-empty { font-size: 0.85rem; color: #9a8b80; padding: 6px 0 10px; }
.doc-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  padding: 10px 0;
  border: 0; border-top: 1px solid var(--carrara);
  background: none;
  font-family: var(--body);
  text-align: left;
  color: var(--espresso);
  cursor: pointer;
}
.doc-row:first-of-type { border-top: 0; }
.doc-row:hover .doc-name { color: var(--navy); text-decoration: underline; }
.doc-icon {
  flex: 0 0 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: var(--ivory);
  color: var(--mocha);
  font-size: 0.6rem; font-weight: 400; letter-spacing: 0.08em;
}
.doc-text { min-width: 0; flex: 1; }
.doc-name { display: block; font-size: 0.92rem; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-meta { display: block; font-size: 0.75rem; color: #9a8b80; }
.doc-row.loading .doc-meta::after { content: ' \00B7  Opening...'; }

/* Messages */
.messages-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.composer { background: #fff; border: 1px solid var(--carrara); padding: 24px; }
.composer label.field-label { display: block; margin-bottom: 8px; }
.composer textarea {
  width: 100%;
  min-height: 150px;
  resize: vertical;
  font-family: var(--body);
  font-size: 0.95rem;
  font-weight: 300;
  color: var(--espresso);
  padding: 12px 14px;
  border: 1px solid var(--sand);
  background: var(--ivory);
}
.composer textarea:focus { outline: 2px solid var(--dusty-blue); outline-offset: -1px; }
.attach-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 14px 0; }
.btn {
  display: inline-block;
  font-family: var(--body);
  font-size: 0.72rem;
  font-weight: 400;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 12px 24px;
  border: 1px solid var(--navy);
  cursor: pointer;
  text-decoration: none;
}
.btn-primary { background: var(--navy); color: var(--ivory); }
.btn-primary:hover { background: #24375f; }
.btn-primary:disabled { opacity: 0.55; cursor: default; }
.btn-outline { background: transparent; color: var(--navy); }
.btn-outline:hover { background: var(--carrara); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--carrara);
  font-size: 0.78rem;
  padding: 4px 6px 4px 10px;
  max-width: 100%;
}
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
.chip button { border: 0; background: none; cursor: pointer; font-size: 1rem; line-height: 1; color: var(--mocha); padding: 0 4px; }
.composer-note { font-size: 0.8rem; color: #9a8b80; margin-top: 14px; }
.notice { font-size: 0.88rem; padding: 10px 14px; margin-top: 14px; display: none; }
.notice.show { display: block; }
.notice.ok { background: #eef1ea; color: #4d5a41; border-left: 3px solid var(--sage); }
.notice.err { background: #f6ebe6; color: #7a3f2c; border-left: 3px solid var(--mocha); }

.history h3 { margin-bottom: 14px; }
.msg { background: #fff; border: 1px solid var(--carrara); padding: 16px 18px; margin-bottom: 12px; }
.msg-head { display: flex; justify-content: space-between; gap: 12px; font-size: 0.75rem; color: #9a8b80; margin-bottom: 6px; }
.msg-head strong { font-weight: 400; color: var(--navy); }
.msg-body { font-size: 0.92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-files { margin-top: 8px; font-size: 0.8rem; color: var(--mocha); }

.state { background: #fff; border: 1px solid var(--carrara); padding: 48px 32px; text-align: center; max-width: 640px; margin: 40px auto; }
.state h2 { font-family: var(--heading); font-weight: 600; font-size: 1.8rem; color: var(--navy); margin-bottom: 12px; }
.state p { margin-bottom: 20px; }
.loading { text-align: center; padding: 80px 0; color: var(--mocha); font-weight: 200; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.8rem; }

@media (max-width: 860px) {
  .messages-layout { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .portal { padding: 32px 16px 64px; }
  .portal-header h1 { font-size: 1.9rem; }
  .doc-grid { grid-template-columns: minmax(0, 1fr); }
  .composer { padding: 18px; }
}
</style>
</head>
<body>

<main class="portal" id="portal">
  <div class="loading">Loading your project...</div>
</main>

<!-- Clerk SDK -->
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_test_cmFwaWQtbWFja2VyZWwtMjguY2xlcmsuYWNjb3VudHMuZGV2JA"
  src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js"
  type="text/javascript"
></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/clerk-auth.js"></script>
<script src="/js/route-guard.js"></script>
<script src="/js/global-nav.js"></script>
<script src="/js/page-init.js"></script>
<script src="/js/client-portal.js"></script>

<script>
(function () {
  'use strict';

  const root = document.getElementById('portal');
  const MAX_FILES = 10;
  const MAX_BYTES = 20 * 1024 * 1024;
  let state = { project: null, projects: [], documents: [], messages: [] };
  let pendingFiles = [];

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function formatDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function formatDateTime(iso) {
    return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function formatSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024 * 1024) return Math.max(1, Math.round(bytes / 1024)) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }
  function typeLabel(mime, name) {
    if (!mime) return 'FILE';
    if (mime === 'application/pdf') return 'PDF';
    if (mime.startsWith('image/')) return 'IMG';
    if (mime.startsWith('video/')) return 'VID';
    const ext = (name.split('.').pop() || '').toUpperCase();
    return ext.length && ext.length <= 4 ? ext : 'FILE';
  }

  // ---- Load ----

  HCHCAuth.onReady(async () => {
    if (!HCHCAuth.isSignedIn()) return; // the route guard sends visitors to sign in
    await load(new URLSearchParams(location.search).get('project'));
  });

  async function load(projectId) {
    try {
      const data = await HCHCPortal.call('overview', projectId ? { project_id: projectId } : {});
      state = data;
      if (!data.projects || !data.projects.length) return renderNoProject();
      render();
      if (location.hash) {
        const target = document.querySelector(location.hash);
        if (target) target.scrollIntoView();
      }
    } catch (e) {
      root.innerHTML = `
        <div class="state">
          <h2>We could not load your project</h2>
          <p>${esc(e.message)}</p>
          <button class="btn btn-outline" onclick="location.reload()">Try Again</button>
        </div>`;
    }
  }

  function renderNoProject() {
    root.innerHTML = `
      <div class="state">
        <p class="eyebrow">Welcome</p>
        <h2>Your project portal is almost ready</h2>
        <p>Ena is setting up your project. You will receive an email when your documents are ready to view.</p>
        <p>In the meantime, you can reach Ena at
          <a href="mailto:ena.dodski@hillcountryhomeconcepts.com">ena.dodski@hillcountryhomeconcepts.com</a>.</p>
      </div>`;
  }

  // ---- Render ----

  function render() {
    const first = HCHCAuth.getFirstName();
    const switcher = state.projects.length > 1 ? `
      <div class="project-switch">
        <label class="eyebrow" for="project-select">Project</label><br>
        <select id="project-select">
          ${state.projects.map(p => `<option value="${esc(p.id)}" ${p.id === state.project.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
        </select>
      </div>` : '';

    root.innerHTML = `
      <header class="portal-header">
        <div>
          <p class="eyebrow">Your Project Portal</p>
          <h1>${first ? 'Welcome, ' + esc(first) + '.' : 'Welcome.'}</h1>
          <p class="project-name">${esc(state.project.name)}</p>
        </div>
        ${switcher}
      </header>

      <section class="section" id="documents">
        <div class="section-title">
          <h2>Documents</h2>
          <span class="eyebrow">Shared by Ena</span>
        </div>
        ${renderDocuments()}
      </section>

      <section class="section" id="messages">
        <div class="section-title">
          <h2>Messages</h2>
          <span class="eyebrow">Photos, files, and questions</span>
        </div>
        <div class="messages-layout">
          <form class="composer" id="composer">
            <label class="eyebrow field-label" for="msg-body">New Message to Ena</label>
            <textarea id="msg-body" maxlength="5000" placeholder="Share a question, an update, or inspiration for your space."></textarea>
            <div class="attach-row">
              <label class="btn btn-outline" for="msg-files">Attach Photos or Files</label>
              <input type="file" id="msg-files" multiple hidden>
              <div class="chips" id="file-chips"></div>
            </div>
            <button type="submit" class="btn btn-primary" id="send-btn">Send Message</button>
            <div class="notice" id="send-notice" role="status"></div>
            <p class="composer-note">Ena will reply by email. You may attach up to ${MAX_FILES} files, 20 MB in total.</p>
          </form>
          <div class="history">
            <h3 class="eyebrow">Sent Messages</h3>
            <div id="history">${renderHistory()}</div>
          </div>
        </div>
      </section>`;

    wireDocuments();
    wireComposer();
    const sel = document.getElementById('project-select');
    if (sel) sel.addEventListener('change', () => {
      root.innerHTML = '<div class="loading">Loading your project...</div>';
      load(sel.value);
    });
  }

  function renderDocuments() {
    const groups = state.documents || [];
    if (!groups.length) {
      return '<div class="doc-group"><p class="doc-empty">Your documents will appear here as soon as Ena shares them.</p></div>';
    }
    return `<div class="doc-grid">${groups.map(g => `
      <div class="doc-group">
        <h3>${esc(g.category)}</h3>
        ${g.files.length ? g.files.map(f => `
          <button type="button" class="doc-row" data-id="${esc(f.id)}" data-name="${esc(f.name)}" data-type="${esc(f.type)}">
            <span class="doc-icon">${esc(typeLabel(f.type, f.name))}</span>
            <span class="doc-text">
              <span class="doc-name">${esc(f.name)}</span>
              <span class="doc-meta">${esc([formatDate(f.modified), formatSize(f.size)].filter(Boolean).join(' · '))}</span>
            </span>
          </button>`).join('') : '<p class="doc-empty">Nothing here yet.</p>'}
      </div>`).join('')}</div>`;
  }

  function renderHistory() {
    const msgs = state.messages || [];
    if (!msgs.length) return '<p class="doc-empty">You have not sent any messages yet.</p>';
    return msgs.map(m => `
      <div class="msg">
        <div class="msg-head"><strong>${esc(m.sender_name || 'You')}</strong><span>${esc(formatDateTime(m.created_at))}</span></div>
        ${m.body ? `<div class="msg-body">${esc(m.body)}</div>` : ''}
        ${m.attachments && m.attachments.length ? `<div class="msg-files">Attached: ${m.attachments.map(a => esc(a.name)).join(', ')}</div>` : ''}
      </div>`).join('');
  }

  // ---- Documents ----

  function wireDocuments() {
    root.querySelectorAll('.doc-row').forEach(row => {
      row.addEventListener('click', async () => {
        const viewable = row.dataset.type === 'application/pdf' || row.dataset.type.startsWith('image/');
        // Open the tab right away so the browser does not block it
        const tab = viewable ? window.open('', '_blank') : null;
        row.classList.add('loading');
        try {
          const url = await HCHCPortal.fileUrl(state.project.id, row.dataset.id);
          if (tab) {
            tab.location.href = url;
          } else {
            const a = document.createElement('a');
            a.href = url;
            a.download = row.dataset.name;
            document.body.appendChild(a);
            a.click();
            a.remove();
          }
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        } catch (e) {
          if (tab) tab.close();
          alert(e.message);
        } finally {
          row.classList.remove('loading');
        }
      });
    });
  }

  // ---- Composer ----

  function wireComposer() {
    const form = document.getElementById('composer');
    const input = document.getElementById('msg-files');
    const notice = document.getElementById('send-notice');

    input.addEventListener('change', () => {
      pendingFiles = pendingFiles.concat(Array.from(input.files));
      input.value = '';
      renderChips();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = document.getElementById('msg-body').value.trim();
      const total = pendingFiles.reduce((n, f) => n + f.size, 0);
      if (!text && !pendingFiles.length) return showNotice('err', 'Please write a message or attach a file.');
      if (pendingFiles.length > MAX_FILES) return showNotice('err', `Please attach no more than ${MAX_FILES} files at a time.`);
      if (total > MAX_BYTES) return showNotice('err', 'These files are too large to send together. Please send them in smaller groups (20 MB per message).');

      const btn = document.getElementById('send-btn');
      btn.disabled = true;
      btn.textContent = pendingFiles.length ? 'Uploading...' : 'Sending...';
      notice.className = 'notice';
      try {
        await HCHCPortal.send(state.project.id, text, pendingFiles);
        pendingFiles = [];
        document.getElementById('msg-body').value = '';
        renderChips();
        showNotice('ok', 'Thank you. Your message was sent to Ena.');
        const fresh = await HCHCPortal.call('overview', { project_id: state.project.id });
        state.messages = fresh.messages;
        document.getElementById('history').innerHTML = renderHistory();
      } catch (err) {
        showNotice('err', err.message + ' You can also email Ena at ena.dodski@hillcountryhomeconcepts.com.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Message';
      }
    });

    function showNotice(kind, text) {
      notice.className = 'notice show ' + kind;
      notice.textContent = text;
    }
  }

  function renderChips() {
    const box = document.getElementById('file-chips');
    box.innerHTML = pendingFiles.map((f, i) => `
      <span class="chip"><span title="${esc(f.name)}">${esc(f.name)}</span>
        <button type="button" data-i="${i}" aria-label="Remove ${esc(f.name)}">&times;</button></span>`).join('');
    box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      pendingFiles.splice(Number(b.dataset.i), 1);
      renderChips();
    }));
  }
})();
</script>
</body>
</html>
