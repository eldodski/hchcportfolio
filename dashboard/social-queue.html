<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Queue | HCHC Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:ital,wght@0,200;0,300;0,400;1,200&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ivory: #F5F0EB;
  --navy: #1B2A4A;
  --espresso: #3C2A21;
  --sand: #D4C5B2;
  --mocha: #A37762;
  --carrara: #E8E4E0;
  --gold: #C4A265;
  --dusty-blue: #7B9BAE;
  --sage: #8A9A7B;
  --heading: 'Cormorant Garamond', Georgia, serif;
  --body: 'Jost', 'Segoe UI', sans-serif;
}

body {
  font-family: var(--body);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.6;
  color: var(--espresso);
  background: var(--ivory);
}

/* --- Top Bar --- */
.topbar {
  background: var(--navy);
  color: var(--ivory);
  padding: 14px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.topbar-logo {
  font-family: var(--heading);
  font-weight: 600;
  font-size: 1.15rem;
  color: var(--ivory);
  text-decoration: none;
}

.topbar-logo span {
  font-family: var(--body);
  font-weight: 200;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--dusty-blue);
  display: block;
  margin-top: -2px;
}

.topbar-right {
  display: flex;
  gap: 20px;
  align-items: center;
}

.topbar-nav { display: flex; gap: 16px; }

.topbar-nav a {
  color: var(--sand);
  font-size: 0.75rem;
  font-weight: 300;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-decoration: none;
  transition: color 0.2s;
}

.topbar-nav a:hover { color: var(--ivory); }

.topbar-user {
  font-size: 0.8rem;
  color: var(--dusty-blue);
}

.topbar-signout {
  background: none;
  border: 1px solid rgba(255,255,255,0.2);
  color: var(--sand);
  font-family: var(--body);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 6px 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.topbar-signout:hover { border-color: var(--ivory); color: var(--ivory); }

/* --- Queue Layout --- */
.queue-container {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 16px 100px;
}

.queue-header {
  margin-bottom: 20px;
}

.queue-header h1 {
  font-family: var(--heading);
  font-weight: 600;
  font-size: 1.6rem;
  color: var(--navy);
}

/* --- Filter Tabs --- */
.filter-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 20px;
  -webkit-overflow-scrolling: touch;
}

.filter-tab {
  flex-shrink: 0;
  font-family: var(--body);
  font-weight: 300;
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 8px 18px;
  border: 1px solid var(--sand);
  background: #fff;
  color: var(--espresso);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.filter-tab:hover { border-color: var(--navy); }

.filter-tab.active {
  background: var(--navy);
  color: var(--ivory);
  border-color: var(--navy);
}

/* --- Post Cards --- */
.post-card {
  background: #fff;
  border: 1px solid var(--sand);
  margin-bottom: 12px;
  padding: 16px;
  transition: border-color 0.2s;
}

.post-card:hover { border-color: var(--navy); }

.post-card-top {
  display: flex;
  gap: 14px;
  margin-bottom: 12px;
}

.post-thumb {
  width: 80px;
  height: 80px;
  object-fit: cover;
  flex-shrink: 0;
  border: 1px solid var(--carrara);
}

.post-thumb-empty {
  width: 80px;
  height: 80px;
  flex-shrink: 0;
  background: var(--carrara);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  color: var(--mocha);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.post-info { flex: 1; min-width: 0; }

.post-caption {
  font-size: 0.88rem;
  color: var(--espresso);
  margin-bottom: 6px;
  line-height: 1.4;
}

.post-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.status-badge {
  display: inline-block;
  font-size: 0.62rem;
  font-weight: 300;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 2px;
}

.status-draft { background: var(--carrara); color: var(--espresso); }
.status-pending { background: #FFF3E0; color: #E65100; }
.status-approved { background: #E8F5E9; color: #2E7D32; }
.status-published { background: #E3F2FD; color: #1565C0; }
.status-rejected { background: #FFEBEE; color: #C62828; }

.platform-icon {
  font-size: 0.62rem;
  font-weight: 400;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: rgba(27, 42, 74, 0.08);
  color: var(--navy);
  padding: 2px 8px;
  border-radius: 2px;
}

.post-type {
  font-size: 0.62rem;
  color: var(--mocha);
  text-transform: capitalize;
}

.post-schedule {
  display: block;
  font-size: 0.72rem;
  color: var(--dusty-blue);
  margin-top: 4px;
}

.rejected-reason {
  font-size: 0.78rem;
  color: #C62828;
  margin-top: 4px;
  font-style: italic;
}

.published-date {
  font-size: 0.72rem;
  color: var(--sage);
}

/* --- Action Buttons --- */
.post-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.action-btn {
  font-family: var(--body);
  font-weight: 300;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 10px 18px;
  border: 1px solid var(--sand);
  background: #fff;
  color: var(--espresso);
  cursor: pointer;
  transition: all 0.2s;
  min-height: 44px;
  display: flex;
  align-items: center;
}

.action-btn:hover { border-color: var(--navy); }

.action-approve {
  background: var(--sage);
  color: #fff;
  border-color: var(--sage);
}
.action-approve:hover { background: #7A8A6B; border-color: #7A8A6B; }

.action-reject {
  background: var(--mocha);
  color: #fff;
  border-color: var(--mocha);
}
.action-reject:hover { background: #936752; border-color: #936752; }

.action-publish {
  background: var(--navy);
  color: var(--ivory);
  border-color: var(--navy);
}
.action-publish:hover { background: var(--mocha); border-color: var(--mocha); }

.action-submit {
  background: var(--dusty-blue);
  color: #fff;
  border-color: var(--dusty-blue);
}
.action-submit:hover { background: #6B8B9E; border-color: #6B8B9E; }

.action-delete { color: #C62828; }
.action-delete:hover { border-color: #C62828; }

/* --- FAB --- */
.fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 56px;
  height: 56px;
  background: var(--navy);
  color: var(--ivory);
  border: none;
  border-radius: 50%;
  font-size: 1.8rem;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(27, 42, 74, 0.3);
  transition: background 0.2s, transform 0.2s;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.fab:hover { background: var(--mocha); transform: scale(1.05); }

/* --- Modal --- */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  overflow-y: auto;
}

.modal-overlay.open { display: block; }

.modal {
  background: var(--ivory);
  min-height: 100vh;
  max-width: 600px;
  margin: 0 auto;
  padding: 20px;
}

@media (min-width: 769px) {
  .modal {
    min-height: auto;
    margin: 40px auto;
    border: 1px solid var(--sand);
  }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.modal-header h2 {
  font-family: var(--heading);
  font-weight: 600;
  font-size: 1.4rem;
  color: var(--navy);
}

.modal-close {
  background: none;
  border: none;
  font-size: 1.6rem;
  color: var(--espresso);
  cursor: pointer;
  padding: 8px;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* --- Form --- */
.form-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 16px;
}

.form-group label {
  font-size: 0.72rem;
  font-weight: 300;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--mocha);
  margin-bottom: 6px;
}

.form-group input,
.form-group textarea,
.form-group select {
  font-family: var(--body);
  font-weight: 300;
  font-size: 0.92rem;
  padding: 12px 14px;
  border: 1px solid var(--sand);
  background: #fff;
  color: var(--espresso);
  outline: none;
  transition: border-color 0.2s;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  border-color: var(--navy);
}

.form-group textarea { resize: vertical; min-height: 100px; }

.char-count {
  font-size: 0.72rem;
  color: var(--mocha);
  text-align: right;
  margin-top: 4px;
}

.image-upload-area {
  border: 2px dashed var(--sand);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s;
  min-height: 44px;
}

.image-upload-area:hover { border-color: var(--navy); }

.image-upload-area p {
  font-size: 0.85rem;
  color: var(--mocha);
  margin: 0 auto;
}

#image-preview img {
  max-width: 100%;
  max-height: 200px;
  object-fit: contain;
  margin-top: 12px;
}

.checkbox-group {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.checkbox-group label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  font-weight: 300;
  color: var(--espresso);
  text-transform: none;
  letter-spacing: 0;
  cursor: pointer;
}

.checkbox-group input[type="checkbox"] {
  width: 20px;
  height: 20px;
  cursor: pointer;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.btn {
  font-family: var(--body);
  font-weight: 300;
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 12px 24px;
  border: none;
  cursor: pointer;
  transition: background 0.2s;
  min-height: 44px;
}

.btn-primary { background: var(--navy); color: var(--ivory); }
.btn-primary:hover { background: var(--mocha); }

.btn-outline {
  background: #fff;
  border: 1px solid var(--sand);
  color: var(--espresso);
}
.btn-outline:hover { border-color: var(--navy); }

/* --- Empty & Loading States --- */
.loading-state, .empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--mocha);
}

.empty-state h3 {
  font-family: var(--heading);
  font-size: 1.2rem;
  color: var(--navy);
  margin-bottom: 8px;
}

.empty-state p { font-size: 0.85rem; margin: 0 auto; }

/* --- Toast --- */
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--espresso);
  color: var(--ivory);
  padding: 12px 24px;
  font-size: 0.85rem;
  font-weight: 300;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  white-space: nowrap;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* --- Responsive --- */
@media (max-width: 768px) {
  .topbar { padding: 12px 16px; }
  .topbar-nav { gap: 10px; }
  .topbar-nav a { font-size: 0.68rem; }
  .topbar-right { gap: 10px; }
  .queue-container { padding: 16px 12px 100px; }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <a href="/" class="topbar-logo">
    Hill Country Home Concepts
    <span>Social Queue</span>
  </a>
  <div class="topbar-right">
    <div class="topbar-nav">
      <a href="/dashboard/">Dashboard</a>
      <a href="/presentation-engine.html">Presentations</a>
      <a href="/">Home</a>
    </div>
    <span class="topbar-user" id="user-display"></span>
    <button class="topbar-signout" id="signout-btn" onclick="signOut()" style="display:none;">Sign Out</button>
  </div>
</div>

<!-- Queue Content -->
<div class="queue-container" id="queue-content">
  <div class="queue-header">
    <h1>Social Queue</h1>
  </div>

  <!-- Filter Tabs -->
  <div class="filter-tabs">
    <button class="filter-tab active" data-status="all">All</button>
    <button class="filter-tab" data-status="draft">Draft</button>
    <button class="filter-tab" data-status="pending">Pending</button>
    <button class="filter-tab" data-status="approved">Approved</button>
    <button class="filter-tab" data-status="published">Published</button>
    <button class="filter-tab" data-status="rejected">Rejected</button>
  </div>

  <!-- Posts List -->
  <div id="posts-list">
    <div class="loading-state">Loading posts...</div>
  </div>
</div>

<!-- FAB -->
<button class="fab" onclick="openCreateModal()" aria-label="New Post">+</button>

<!-- Create/Edit Modal -->
<div class="modal-overlay" id="post-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">New Post</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>

    <form id="post-form" onsubmit="handlePostSubmit(event)">
      <!-- Image Upload -->
      <div class="form-group">
        <label>Image</label>
        <label class="image-upload-area" for="post-image">
          <p>Tap to select image (max 5MB)</p>
          <input type="file" id="post-image" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
        </label>
        <div id="image-preview"></div>
      </div>

      <!-- Caption -->
      <div class="form-group">
        <label for="post-caption">Caption</label>
        <textarea id="post-caption" rows="4" placeholder="Write your caption..." oninput="updateCharCount()"></textarea>
        <span class="char-count" id="char-count">0 / 2200</span>
      </div>

      <!-- Hashtags -->
      <div class="form-group">
        <label for="post-hashtags">Hashtags (comma-separated)</label>
        <input type="text" id="post-hashtags" placeholder="interiordesign, hillcountry, kitchenreno">
      </div>

      <!-- Platforms -->
      <div class="form-group">
        <label>Platforms</label>
        <div class="checkbox-group">
          <label><input type="checkbox" id="plat-instagram"> Instagram</label>
          <label><input type="checkbox" id="plat-facebook"> Facebook</label>
          <label><input type="checkbox" id="plat-pinterest"> Pinterest</label>
        </div>
      </div>

      <!-- Project Type -->
      <div class="form-group">
        <label for="post-project-type">Project Type</label>
        <select id="post-project-type">
          <option value="">None</option>
          <option value="kitchen">Kitchen</option>
          <option value="bathroom">Bathroom</option>
          <option value="flooring">Flooring</option>
          <option value="tile">Tile</option>
          <option value="living">Living</option>
          <option value="bedroom">Bedroom</option>
          <option value="exterior">Exterior</option>
          <option value="moodboard">Mood Board</option>
        </select>
      </div>

      <!-- Alt Text -->
      <div class="form-group">
        <label for="post-alt-text">Alt Text (accessibility)</label>
        <input type="text" id="post-alt-text" placeholder="Describe the image for screen readers">
      </div>

      <!-- Schedule -->
      <div class="form-group">
        <label for="post-schedule">Schedule (optional)</label>
        <input type="datetime-local" id="post-schedule">
      </div>

      <!-- Actions -->
      <div class="modal-actions">
        <button type="submit" class="btn btn-outline" id="save-btn">Save Draft</button>
        <button type="button" class="btn btn-primary" id="submit-review-btn" onclick="submitForReview()">Submit for Review</button>
      </div>
    </form>
  </div>
</div>

<!-- Scripts -->
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_test_cmFwaWQtbWFja2VyZWwtMjguY2xlcmsuYWNjb3VudHMuZGV2JA"
  src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js"
  type="text/javascript"
></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/clerk-auth.js"></script>
<script src="/js/route-guard.js"></script>
<script src="/js/social-queue.js"></script>

<script src="/js/global-nav.js"></script>
<script src="/js/page-init.js"></script>
</body>
</html>
