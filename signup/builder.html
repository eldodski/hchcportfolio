<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Builder Sign Up | HCHC</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/logo/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:ital,wght@0,200;0,300;0,400;1,200&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ivory: #F5F0EB;
  --navy: #1B2A4A;
  --espresso: #3C2A21;
  --sand: #D4C5B2;
  --mocha: #A37762;
  --carrara: #E8E4E0;
  --gold: #C4A265;
  --heading: 'Cormorant Garamond', Georgia, serif;
  --body: 'Jost', 'Segoe UI', sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--body);
  font-weight: 400;
  font-size: 17px;
  line-height: 1.7;
  color: var(--espresso);
  background: var(--ivory);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}

a { color: inherit; text-decoration: none; }

h1, h2 {
  font-family: var(--heading);
  font-weight: 600;
  color: var(--navy);
  line-height: 1.2;
}

.signup-card {
  background: #fff;
  border: 1px solid var(--carrara);
  padding: 48px 40px;
  max-width: 500px;
  width: 100%;
  text-align: center;
}

.signup-card .wordmark {
  display: block;
  margin: 0 auto 28px;
  height: 36px;
}

.signup-card .role-label {
  font-weight: 200;
  font-size: 0.78rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mocha);
  margin-bottom: 8px;
}

.signup-card h1 {
  font-size: 1.6rem;
  margin-bottom: 16px;
}

.signup-card .description {
  font-size: 0.95rem;
  color: var(--espresso);
  margin-bottom: 32px;
  max-width: none;
}

.company-field {
  margin-bottom: 24px;
  text-align: left;
}

.company-field label {
  display: block;
  font-weight: 300;
  font-size: 0.82rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--mocha);
  margin-bottom: 6px;
}

.company-field input {
  width: 100%;
  padding: 12px 16px;
  font-family: var(--body);
  font-size: 0.95rem;
  color: var(--espresso);
  background: var(--ivory);
  border: 1px solid var(--carrara);
  outline: none;
  transition: border-color 0.3s ease;
}

.company-field input:focus {
  border-color: var(--navy);
}

.company-field input::placeholder {
  color: var(--sand);
}

#clerk-sign-up {
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.terms-row {
  margin-top: 20px;
  text-align: left;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 0.82rem;
  color: var(--espresso);
  line-height: 1.5;
}

.terms-row input[type="checkbox"] {
  margin-top: 3px;
  accent-color: var(--navy);
  flex-shrink: 0;
  width: 16px;
  height: 16px;
}

.terms-row a {
  color: var(--navy);
  border-bottom: 1px solid var(--gold);
  transition: color 0.3s ease;
}

.terms-row a:hover { color: var(--mocha); }

.terms-warning {
  color: #c0392b;
  font-size: 0.8rem;
  margin-top: 8px;
  display: none;
  text-align: left;
}

.back-link {
  margin-top: 28px;
  font-size: 0.9rem;
  color: var(--espresso);
}

.back-link a {
  color: var(--navy);
  font-weight: 400;
  border-bottom: 1px solid var(--gold);
  transition: color 0.3s ease;
}

.back-link a:hover { color: var(--mocha); }
</style>
</head>
<body>

<div class="signup-card">
  <img src="/images/logo/hchc-wordmark-navy.svg" alt="Hill Country Home Concepts" class="wordmark">
  <p class="role-label">Builder Account</p>
  <h1>Create Your Account</h1>
  <p class="description">Access the complete presentation suite, finish selection management, multi-project dashboard, and team collaboration tools for your builds.</p>
  <div class="company-field">
    <label for="company-name">Company Name</label>
    <input type="text" id="company-name" placeholder="Your construction company name">
  </div>
  <div id="clerk-sign-up"></div>
  <div class="terms-row">
    <input type="checkbox" id="terms-agree">
    <label for="terms-agree">I have read and agree to the <a href="/terms.html" target="_blank">Terms of Service</a> and <a href="/subscription-terms.html" target="_blank">Subscription Terms</a> and acknowledge the <a href="/privacy.html" target="_blank">Privacy Policy</a>.</label>
  </div>
  <p class="terms-warning" id="terms-warning">You must agree to the terms before creating an account.</p>
  <p class="back-link"><a href="/signup/">Back to account types</a></p>
</div>

<!-- Auth System -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async></script>
<script
  data-clerk-publishable-key="pk_test_cmFwaWQtbWFja2VyZWwtMjguY2xlcmsuYWNjb3VudHMuZGV2JA"
  src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js"
  async>
</script>
<script src="/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/clerk-auth.js"></script>
<script src="/js/route-guard.js"></script>
<script src="/js/global-nav.js"></script>
<script src="/js/page-init.js"></script>
<script>
HCHCAuth.onReady(function() {
  if (HCHCAuth.isSignedIn()) { window.location.href = '/dashboard/'; return; }
  var termsBox = document.getElementById('terms-agree');
  var clerkEl = document.getElementById('clerk-sign-up');
  var companyInput = document.getElementById('company-name');
  if (window.Clerk && clerkEl) {
    window.Clerk.mountSignUp(clerkEl, {
      appearance: { variables: { colorPrimary: '#1B2A4A', colorText: '#3C2A21', fontFamily: 'Jost, sans-serif', borderRadius: '0px' } },
      unsafeMetadata: { role: 'builder', company: companyInput.value }
    });
    // Update metadata when company name changes
    companyInput.addEventListener('input', function() {
      // Remount with updated company name
      window.Clerk.unmountSignUp(clerkEl);
      window.Clerk.mountSignUp(clerkEl, {
        appearance: { variables: { colorPrimary: '#1B2A4A', colorText: '#3C2A21', fontFamily: 'Jost, sans-serif', borderRadius: '0px' } },
        unsafeMetadata: { role: 'builder', company: companyInput.value }
      });
    });
  }
  clerkEl.addEventListener('click', function(e) {
    var btn = e.target.closest('button[type="submit"], button[data-localization-key*="signUp"]');
    if (btn && !termsBox.checked) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('terms-warning').style.display = 'block';
    } else {
      document.getElementById('terms-warning').style.display = 'none';
    }
  }, true);
});
</script>
</body>
</html>
